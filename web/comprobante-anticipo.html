<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Comprobante de anticipo - Sahara Club Spa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0F0F0F; --card:#16161A; --gold:#C6A76A; --line:#2A2A2E;
      --muted:#9A9388; --text:#ECE7DF;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .voucher{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);
      border-radius:18px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5)}
    .top{padding:34px 32px 22px;text-align:center;border-bottom:1px solid var(--line)}
    .brand{font-family:'Playfair Display',serif;color:var(--gold);font-size:26px;letter-spacing:2px}
    .sub{color:var(--muted);font-size:12px;letter-spacing:3px;margin-top:6px;text-transform:uppercase}
    .badge{display:inline-block;margin-top:18px;background:var(--gold);color:#1a1a1a;
      font-weight:700;font-size:12px;letter-spacing:2px;padding:7px 18px;border-radius:999px}
    .body{padding:26px 32px}
    .row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
      padding:13px 0;border-bottom:1px solid var(--line)}
    .row:last-child{border-bottom:none}
    .label{color:var(--muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
    .value{color:var(--text);font-size:15px;font-weight:500;text-align:right}
    .amount{font-family:'Playfair Display',serif;color:var(--gold);font-size:30px}
    .note{color:var(--muted);font-size:12.5px;line-height:1.6;margin:22px 32px 0;text-align:center}
    .actions{padding:24px 32px 32px;display:flex;gap:12px}
    button{flex:1;cursor:pointer;border:none;border-radius:10px;padding:14px;font-family:inherit;
      font-weight:600;font-size:13px;letter-spacing:1px}
    .print{background:var(--gold);color:#1a1a1a}
    .home{background:transparent;color:var(--muted);border:1px solid var(--line)}
    .foot{text-align:center;color:var(--muted);font-size:11px;padding:0 32px 26px}
    .loading{padding:60px 32px;text-align:center;color:var(--muted)}
    @media print{
      body{background:#fff;color:#111}
      .voucher{box-shadow:none;border:1px solid #ddd}
      .actions{display:none}
    }
  </style>
</head>
<body>
  <div class="voucher" id="voucher">
    <div class="loading">Cargando tu comprobante...</div>
  </div>

  <script>
    const SUPA = 'https://fkbyxhwdcsgrrixalzwf.supabase.co';
    const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZrYnl4aHdkY3NncnJpeGFsendmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NzE3MjYsImV4cCI6MjA5MzE0NzcyNn0.IJ2nDtgBPkbY8CRDmGGJTvE6kELrY0sp3_F9yseZP9Q';
    const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

    function fmtDate(iso){
      try{ const [y,m,d]=iso.split('-').map(n=>parseInt(n,10)); return d+' de '+MESES[(m-1)%12]+' de '+y; }
      catch(e){ return iso; }
    }
    function fmtTime(t){
      if(!t) return '';
      let [h,min]=t.split(':'); h=parseInt(h,10);
      const ap=h>=12?'PM':'AM'; h=h%12; if(h===0)h=12;
      return h+':'+min+' '+ap;
    }
    function money(n){ return '$'+Number(n).toLocaleString('es-MX',{minimumFractionDigits:2}); }

    const params = new URLSearchParams(location.search);
    const token = (params.get('token') || '').trim();
    const sid = (params.get('session_id') || '').trim();
    const validToken = /^[A-Za-z0-9_.-]{24,320}$/.test(token);
    const validSession = /^cs_(test|live)_[A-Za-z0-9_]{8,220}$/.test(sid);
    const qs = validToken
      ? 'token='+encodeURIComponent(token)
      : validSession
        ? 'session_id='+encodeURIComponent(sid)
        : '';

    if(!qs){
      fail();
    }else{
      fetch(SUPA+'/functions/v1/deposit_voucher?'+qs, {
        headers: { apikey: ANON, Authorization: 'Bearer '+ANON },
        cache: 'no-store'
      })
        .then(r=>r.ok ? r.json() : Promise.reject(new Error('voucher_unavailable')))
        .then(d=>{ if(d && d.ok && d.pagado === true){ render(d); } else { fail(); } })
        .catch(fail);
    }

    function fail(){
      const root = document.getElementById('voucher');
      root.replaceChildren();
      const msg = el('div', 'loading');
      msg.append('No pudimos cargar el comprobante.');
      msg.appendChild(document.createElement('br'));
      msg.append('Tu pago esta seguro; recepcion te confirmara tu cita.');
      const actions = el('div', 'actions');
      actions.append(button('home', 'Volver a Sahara', () => { location.href = 'https://saharaclubspa.com'; }));
      root.append(msg, actions);
    }

    function render(d){
      const root = document.getElementById('voucher');
      root.replaceChildren();

      const top = el('div', 'top');
      top.append(el('div', 'brand', 'SAHARA CLUB SPA'));
      top.append(el('div', 'sub', 'Comprobante de anticipo'));
      top.append(el('div', 'badge', 'PAGADO'));

      const body = el('div', 'body');
      body.append(row('Folio', d.folio));
      body.append(row('Cliente', d.cliente || 'Cliente Sahara'));
      body.append(row('Servicio', d.servicio || 'Servicio'));
      body.append(row('Fecha', fmtDate(String(d.fecha || ''))));
      body.append(row('Hora', fmtTime(String(d.hora || ''))));
      body.append(row('Anticipo pagado', money(d.monto)+' MXN', 'amount'));

      const note = el('div', 'note', 'Tu anticipo se aplica al costo total del servicio. Recepcion confirma tu cita y te esperamos. Conserva este comprobante.');
      const actions = el('div', 'actions');
      actions.append(button('print', 'Descargar / Imprimir', () => window.print()));
      actions.append(button('home', 'Volver a Sahara', () => { location.href = 'https://saharaclubspa.com'; }));
      const foot = el('div', 'foot', 'Calle Segunda 2226, Ensenada B.C. - saharaclubspa.com');
      root.append(top, body, note, actions, foot);
    }

    function el(tag, className, text){
      const node = document.createElement(tag);
      node.className = className;
      if(text !== undefined) node.textContent = String(text);
      return node;
    }
    function button(className, text, onClick){
      const node = document.createElement('button');
      node.className = className;
      node.type = 'button';
      node.textContent = text;
      node.addEventListener('click', onClick);
      return node;
    }
    function row(label, value, extraClass){
      const r = el('div', 'row');
      r.append(el('span', 'label', label));
      r.append(el('span', extraClass ? 'value '+extraClass : 'value', value || ''));
      return r;
    }
  </script>
</body>
</html>

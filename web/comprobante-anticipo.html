<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Comprobante de anticipo - Sahara Club Spa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;600&display=swap"
      rel="stylesheet">
    <style>
    :root {
      --bg: #0F0F0F;
      --card: #16161A;
      --gold: #C6A76A;
      --line: #2A2A2E;
      --muted: #9A9388;
      --text: #ECE7DF;
      --danger: #FFB4A8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter',system-ui,sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .voucher {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,.5);
    }
    .top {
      padding: 34px 32px 22px;
      text-align: center;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      font-family: 'Playfair Display',serif;
      color: var(--gold);
      font-size: 26px;
      letter-spacing: 2px;
    }
    .sub {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 3px;
      margin-top: 6px;
      text-transform: uppercase;
    }
    .badge {
      display: inline-block;
      margin-top: 18px;
      background: var(--gold);
      color: #1a1a1a;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 2px;
      padding: 7px 18px;
      border-radius: 999px;
    }
    .badge.pending {
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold);
    }
    .body {
      padding: 26px 32px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
    }
    .row:last-child {
      border-bottom: none;
    }
    .label {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .value {
      color: var(--text);
      font-size: 15px;
      font-weight: 500;
      text-align: right;
    }
    .amount {
      font-family: 'Playfair Display',serif;
      color: var(--gold);
      font-size: 30px;
    }
    .note {
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.6;
      margin: 22px 32px 0;
      text-align: center;
    }
    .actions {
      padding: 24px 32px 32px;
      display: flex;
      gap: 12px;
    }
    button {
      flex: 1;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-family: inherit;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 1px;
    }
    .print {
      background: var(--gold);
      color: #1a1a1a;
    }
    .home {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
    }
    .foot {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      padding: 0 32px 26px;
    }
    .state {
      padding: 60px 32px;
      text-align: center;
      color: var(--muted);
      line-height: 1.6;
    }
    .state strong {
      display: block;
      color: var(--text);
      font-size: 17px;
      margin-bottom: 8px;
    }
    .state.error strong {
      color: var(--danger);
    }
    @media print {
      body {
        background: #fff;
        color: #111;
      }
      .voucher {
        box-shadow: none;
        border: 1px solid #ddd;
      }
      .actions {
        display: none;
      }
    }
    </style>
  </head>
  <body>
    <div class="voucher" id="voucher">
      <div class="state"><strong>Cargando comprobante</strong>Validando acceso seguro...</div>
    </div>

    <script>
    const DEPOSIT_VOUCHER_ENDPOINT =
      "https://fkbyxhwdcsgrrixalzwf.supabase.co/functions/v1/deposit_voucher"
    const MESES = [
      "enero",
      "febrero",
      "marzo",
      "abril",
      "mayo",
      "junio",
      "julio",
      "agosto",
      "septiembre",
      "octubre",
      "noviembre",
      "diciembre",
    ]

    const params = new URLSearchParams(location.search)
    const voucherToken = (params.get("voucher_token") || "").trim()
    if (history && history.replaceState) {
      history.replaceState(null, document.title, location.pathname)
    }

    const validVoucherToken = /^[A-Za-z0-9_-]{40,1800}\.[A-Za-z0-9_-]{32,220}$/.test(
      voucherToken,
    )

    if (!validVoucherToken) {
      showError("Comprobante no disponible", "El enlace no es valido o ya fue reemplazado.")
    } else {
      loadVoucher(voucherToken)
    }

    function loadVoucher(token) {
      fetch(DEPOSIT_VOUCHER_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ voucher_token: token }),
        cache: "no-store",
      })
        .then(function (response) {
          return response.json()
            .catch(function () {
              return {}
            })
            .then(function (data) {
              return { status: response.status, data: data }
            })
        })
        .then(function (result) {
          if (result.status === 409) {
            showPending()
            return
          }
          if (result.status !== 200 || !isValidReceiptPayload(result.data)) {
            showError(
              "No pudimos cargar el comprobante",
              "Tu pago esta seguro; recepcion te confirmara tu cita.",
            )
            return
          }
          render(result.data)
        })
        .catch(function () {
          showError(
            "No pudimos cargar el comprobante",
            "Tu pago esta seguro; recepcion te confirmara tu cita.",
          )
        })
    }

    function isValidReceiptPayload(data) {
      return data && data.ok === true &&
        typeof data.business_name === "string" &&
        typeof data.receipt_number === "string" &&
        typeof data.customer_display_name === "string" &&
        typeof data.service_name === "string" &&
        typeof data.amount === "number" &&
        typeof data.currency === "string" &&
        typeof data.booking_date === "string" &&
        typeof data.booking_time === "string" &&
        data.payment_status === "paid" &&
        data.receipt_status === "available"
    }

    function showPending() {
      const root = document.getElementById("voucher")
      root.replaceChildren()
      const top = buildTop("PENDIENTE", true)
      const state = el("div", "state")
      state.append(el("strong", "", "Pago pendiente"))
      state.append(
        "El anticipo aun no aparece confirmado. Si acabas de pagar, espera un momento y vuelve a abrir el enlace.",
      )
      root.append(top, state, buildActions(false))
    }

    function showError(title, message) {
      const root = document.getElementById("voucher")
      root.replaceChildren()
      const state = el("div", "state error")
      state.append(el("strong", "", title))
      state.append(message)
      root.append(state, buildActions(false))
    }

    function render(data) {
      const root = document.getElementById("voucher")
      root.replaceChildren()

      const body = el("div", "body")
      body.append(row("Folio", data.receipt_number))
      body.append(row("Cliente", data.customer_display_name))
      body.append(row("Servicio", data.service_name))
      body.append(row("Fecha", fmtDate(data.booking_date)))
      body.append(row("Hora", fmtTime(data.booking_time)))
      body.append(row("Anticipo pagado", money(data.amount) + " " + data.currency, "amount"))

      const note = el(
        "div",
        "note",
        "Tu anticipo se aplica al costo total del servicio. Recepcion confirma tu cita y te esperamos. Conserva este comprobante.",
      )
      const foot = el("div", "foot", "Calle Segunda 2226, Ensenada B.C. - saharaclubspa.com")
      root.append(buildTop("PAGADO", false), body, note, buildActions(true), foot)
    }

    function buildTop(label, pending) {
      const top = el("div", "top")
      top.append(el("div", "brand", "SAHARA CLUB SPA"))
      top.append(el("div", "sub", "Comprobante de anticipo"))
      top.append(el("div", pending ? "badge pending" : "badge", label))
      return top
    }

    function buildActions(canPrint) {
      const actions = el("div", "actions")
      if (canPrint) {
        actions.append(button("print", "Descargar / Imprimir", function () {
          window.print()
        }))
      }
      actions.append(button("home", "Volver a Sahara", function () {
        location.href = "https://saharaclubspa.com"
      }))
      return actions
    }

    function fmtDate(iso) {
      try {
        const parts = String(iso || "").split("-").map(function (n) {
          return parseInt(n, 10)
        })
        if (
          parts.length !== 3 || parts.some(function (n) {
            return !Number.isFinite(n)
          })
        ) {
          return String(iso || "")
        }
        return parts[2] + " de " + MESES[(parts[1] - 1) % 12] + " de " + parts[0]
      } catch (e) {
        return String(iso || "")
      }
    }

    function fmtTime(value) {
      const pieces = String(value || "").split(":")
      if (pieces.length < 2) return ""
      let hour = parseInt(pieces[0], 10)
      const minute = pieces[1]
      if (!Number.isFinite(hour)) return ""
      const ap = hour >= 12 ? "PM" : "AM"
      hour = hour % 12
      if (hour === 0) hour = 12
      return hour + ":" + minute + " " + ap
    }

    function money(value) {
      return "$" + Number(value).toLocaleString("es-MX", { minimumFractionDigits: 2 })
    }

    function el(tag, className, text) {
      const node = document.createElement(tag)
      if (className) node.className = className
      if (text !== undefined) node.textContent = String(text)
      return node
    }

    function button(className, text, onClick) {
      const node = document.createElement("button")
      node.className = className
      node.type = "button"
      node.textContent = text
      node.addEventListener("click", onClick)
      return node
    }

    function row(label, value, extraClass) {
      const item = el("div", "row")
      item.append(el("span", "label", label))
      item.append(el("span", extraClass ? "value " + extraClass : "value", value || ""))
      return item
    }
    </script>
  </body>
</html>

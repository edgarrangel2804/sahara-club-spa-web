name: Vercel Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter SDK and build
        run: |
          git clone https://github.com/flutter/flutter.git -b 3.38.9 --depth 1 ~/flutter
          export PATH="$PATH:~/flutter/bin:~/flutter/bin/cache/dart-sdk/bin"
          flutter --version
          flutter pub get
          flutter build web --release

      - name: Prepare Vercel prebuilt output
        run: |
          mkdir -p .vercel/output/static
          cp -R build/web/. .vercel/output/static/
          printf '{"version":3}' > .vercel/output/config.json
          printf '{"orgId":"%s","projectId":"%s"}' \
            "${{ secrets.VERCEL_ORG_ID }}" \
            "${{ secrets.VERCEL_PROJECT_ID }}" > .vercel/project.json

      - name: Deploy to Vercel
        run: npx vercel@latest deploy --prebuilt --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
